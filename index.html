<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        form { padding: 8px; display: flex; gap: 8px; align-items: center; }
        #map { height: calc(100vh - 50px); }
    </style>
</head>
<body>
    <form id="form">
        <select id="area">
            <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
        </select>
        <select id="indoor">
            <option value="">실내/야외 전체</option>
            <option value="true">실내</option>
            <option value="false">야외</option>
        </select>
        <button>찾기</button>
        <span id="msg"></span>
    </form>
    <div id="map"></div>
    <script>
        const MAX = 8

        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors", maxZoom: 19,
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const spotsPromise = fetch("제주대_JSON꺼내기_실습데이_8시간/jeju_spots.json").then(r => r.json()).then(d => d.spots)

        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault()
            const area = document.getElementById("area").value
            const indoorValue = document.getElementById("indoor").value
            const spots = await spotsPromise
            const found = spots.filter(s =>
                s.area === area &&
                (indoorValue === "" || s.indoor === (indoorValue === "true"))
            )
            const shown = found.slice(0, MAX)
            document.getElementById("msg").textContent = `${found.length}곳 중 ${shown.length}곳 표시`

            layer.clearLayers()
            for (const s of shown) {
                L.marker([s.lat, s.lon]).addTo(layer)
                    .bindPopup(`<b>${s.name}</b><br>${s.area} · ${s.indoor ? "실내" : "야외"}<br>${s.desc}`)
            }
            if (shown.length) map.fitBounds(shown.map(s => [s.lat, s.lon]), { padding: [60, 60], maxZoom: 13 })
        })
    </script>
</body>
</html>
