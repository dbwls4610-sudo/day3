<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        form { padding: 8px; display: flex; gap: 8px; }
        input { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; }
        main { flex: 1; display: flex; min-height: 0; }
        #chat { width: 40%; overflow-y: auto; padding: 12px; box-sizing: border-box; }
        #map { flex: 1; }
        .step { font-size: 12px; color: #666; margin: 2px 0; }
        .user { font-weight: bold; margin: 12px 0 4px; }
        .bot { white-space: pre-wrap; margin: 4px 0 12px; }
        @media (max-width: 700px) { main { flex-direction: column-reverse; } #chat { width: auto; height: 50%; } }
    </style>
</head>
<body>
    <form id="form">
        <input id="q" placeholder="예: 비 오는 날 서귀포에서 갈 만한 곳 추천해줘" autocomplete="off">
        <button>추천받기</button>
    </form>
    <main>
        <div id="chat"></div>
        <div id="map"></div>
    </main>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | Weather: Open-Meteo", maxZoom: 19,
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)
        const chat = document.getElementById("chat")
        const history = []

        const add = (cls, text) => {
            const div = document.createElement("div")
            div.className = cls
            div.textContent = text
            chat.appendChild(div)
            chat.scrollTop = chat.scrollHeight
            return div
        }

        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault()
            const input = document.getElementById("q")
            const message = input.value.trim()
            if (!message) return
            input.value = ""
            add("user", message)
            const wait = add("step", "에이전트가 도구를 사용 중…")
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message, history }),
                })
                const data = await res.json()
                wait.remove()
                if (data.error) return add("bot", "오류: " + data.error)
                for (const s of data.steps) add("step", `🔧 ${s.tool}(${JSON.stringify(s.input)})`)
                add("bot", data.answer)
                history.push({ role: "user", content: message }, { role: "assistant", content: data.answer })

                layer.clearLayers()
                for (const s of data.spots) {
                    L.marker([s.lat, s.lon]).addTo(layer)
                        .bindPopup(`<b>${s.name}</b><br>${s.area} · ${s.indoor ? "실내" : "야외"}<br>${s.desc}`)
                }
                if (data.spots.length) map.fitBounds(data.spots.map(s => [s.lat, s.lon]), { padding: [40, 40], maxZoom: 12 })
            } catch (err) {
                wait.remove()
                add("bot", "요청에 실패했습니다: " + err.message)
            }
        })
    </script>
</body>
</html>
